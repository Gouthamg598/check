<body>
    <div class="login-form">
        <div class="form-group">
            <h2>Login</h2>
        </div>
        <form (ngSubmit)="onSubmit()" #f="ngForm" name="form">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" class="form-control" id="username" name="username" [(ngModel)]="login.email"
                    required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" [(ngModel)]="login.password"
                    required>
            </div>
            <div class="form-group">
                <button type="submit">Login</button>
                <button type="button" (click)="onReset(f)">Reset</button>
            </div>
            <div *ngIf="errorMessage" class="text-danger">
                {{ errorMessage }}
            </div>
        </form>

    </div>


</body>
