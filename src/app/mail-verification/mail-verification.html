<form (ngSubmit)="onSubmit()" #f="ngForm" name="form">
    <div class="form-group">
        <label for="mailId">Mail Id :</label>
        <input type="email" name="mailId" [(ngModel)]="verification.email" required>
    </div>
    <div class="form-group">
        <label for="otp">OTP :</label>
        <input type="number" name="otp" [(ngModel)]="verification.otp" required>

    </div>

    <div class="form-group">
        <button type="submit">Register</button>
        <button type="button" (click)="onReset(f)">Reset</button>
    </div>

    <button type="button" class="resend-link" (click)="sendOtp(verification.email)">
        Resend OTP
    </button>

</form>
